[project]
name = "mcp-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Srinivas Guttikonda", email = "sais60990@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "ruff>=0.16.3",
